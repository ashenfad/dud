name: Firecracker conformance

# The rung-3 gate. Until now this corpus only ran by hand, on a nested
# Lima VM that degrades after ~30-40 minutes of VM churn (see
# dev/fc-test.sh) — so every ambiguous failure cost a judgement call
# about whether the code or the environment was at fault. A hosted
# runner is a fresh machine every time, which removes the question.
#
# Separate workflow rather than a matrix entry in test.yml: it needs
# /dev/kvm, a VMM binary and a ~40 MB kernel, and it takes minutes
# rather than seconds. Failing it should read as "the VM rung broke",
# not as "the Python matrix is red".

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest  # x86-64, and the only hosted runner with /dev/kvm

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # Hosted runners ship /dev/kvm but leave it root-only. The udev
    # rule is the documented way in; `ls -l` afterwards so a permission
    # regression reads as a permission problem rather than as every
    # test failing to boot.
    - name: Enable KVM for the runner user
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    # Pinned, not "latest": a floating VMM version would make a red run
    # ambiguous between dud's change and firecracker's.
    - name: Install firecracker
      env:
        FC_VERSION: v1.16.1
      run: |
        set -euo pipefail
        curl -fsSL -o fc.tgz \
          "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
        tar -xzf fc.tgz
        sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" \
          /usr/local/bin/firecracker
        firecracker --version

    - name: Install dud
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Cache the pinned kernel and the pulled image layers together:
    # both are content-addressed under ~/.dud and keyed by pins in the
    # tree, so the key is the files that carry those pins.
    - name: Cache ~/.dud
      uses: actions/cache@v4
      with:
        path: ~/.dud
        key: dud-home-${{ runner.os }}-${{ hashFiles('dud/kernels.py', 'dud/images/debs.py') }}

    # The asset is public and fetches anonymously, so this does not need
    # a token to succeed. GH_TOKEN is here for the path that only runs
    # when the plain download FAILS: dud.kernels falls back to `gh
    # release download`, which on a hosted runner has no stored
    # credentials — so without this the fallback is dead code exactly
    # when a transient GitHub hiccup would call for it.
    - name: Fetch the pinned guest kernel
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -m dud.kernels

    # The same corpus the other rungs run, unsliced: a hosted runner is
    # fresh, so it does not need dev/fc-test.sh's restart-between-slices
    # workaround for a dev VM that wears out.
    - name: Conformance (firecracker)
      env:
        DUD_BACKEND: firecracker
      run: pytest tests/conformance -v --durations=10
