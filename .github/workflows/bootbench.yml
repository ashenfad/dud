name: Boot benchmark

# Boot and thaw timings, on a machine whose numbers mean something.
#
# The dev rig is firecracker nested inside a Lima VM on macOS, where
# run-to-run variance measured +-0.4s — larger than most of the effects
# worth chasing. This job runs the same measurements on a hosted runner
# so a change can be judged against a reproducible baseline, and so
# firecracker's own load_snapshot latency can be compared with AWS's
# published figures.
#
# Deliberately NOT the conformance corpus: that takes ~20 minutes and
# answers pass/fail, which is the wrong instrument for a number. This
# takes a couple of minutes and prints the numbers.

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # aim it at a branch when a change should move a number

# On main and on demand rather than on every PR. Kept, though, and for
# a reason worth stating: the golden-snapshot path falls back to a cold
# boot on ANY failure, by design — so if cloning silently stops
# working, every conformance test still passes and the only symptom is
# that sessions got 30x slower. Correctness tests cannot see that.
# This is the thing that would.

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest  # x86-64, and the only hosted runner with /dev/kvm

    steps:
    - uses: actions/checkout@v4

    # Matched to the default image's interpreter (python:3.12-slim) on
    # purpose. Bytecode is minor-version scoped, so a rootfs built by a
    # 3.13 host ships none — and the guest then compiles ~1100 stdlib
    # modules on every boot, which is the thing this job is meant to be
    # measuring the absence of. Compiling with the GUEST's interpreter
    # instead would remove this coupling; until then, the pin is the
    # honest way to keep the two in step.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Hosted runners ship /dev/kvm but leave it root-only. The udev
    # rule is the documented way in; `ls -l` afterwards so a permission
    # regression reads as a permission problem rather than as every
    # test failing to boot.
    - name: Enable KVM for the runner user
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    # Pinned, not "latest": a floating VMM version would make a red run
    # ambiguous between dud's change and firecracker's.
    - name: Install firecracker
      env:
        FC_VERSION: v1.16.1
      run: |
        set -euo pipefail
        curl -fsSL -o fc.tgz \
          "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
        tar -xzf fc.tgz
        sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" \
          /usr/local/bin/firecracker
        firecracker --version

    # erofs is the faster medium: initramfs makes the kernel decompress
    # the whole rootfs into RAM before /init runs (measured at 3.3s of a
    # 4.2s kernel phase), where erofs is demand-paged from a block
    # device. Building one needs mkfs.erofs on PATH — without it the
    # build raises NotImplementedError rather than falling back, since
    # the builder-VM path is macOS-only.
    - name: Install erofs-utils
      run: sudo apt-get update -qq && sudo apt-get install -yqq erofs-utils

    - name: Install dud
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Cache the pinned kernel and the pulled image layers together:
    # both are content-addressed under ~/.dud and keyed by pins in the
    # tree, so the key is the files that carry those pins.
    - name: Cache ~/.dud
      uses: actions/cache@v4
      with:
        path: ~/.dud
        key: dud-home-${{ runner.os }}-${{ hashFiles('dud/kernels.py', 'dud/images/debs.py') }}

    # The asset is public and fetches anonymously, so this does not need
    # a token to succeed. GH_TOKEN is here for the path that only runs
    # when the plain download FAILS: dud.kernels falls back to `gh
    # release download`, which on a hosted runner has no stored
    # credentials — so without this the fallback is dead code exactly
    # when a transient GitHub hiccup would call for it.
    - name: Fetch the pinned guest kernel
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -m dud.kernels

    - name: Boot benchmark
      env:
        DUD_BACKEND: firecracker
        DUD_FC_METRICS: "1"
      run: |
        python dev/bootbench.py --medium erofs
        echo "--- initramfs, for comparison"
        python dev/bootbench.py --medium initramfs --boots 2
        echo "--- golden snapshot: N clones from one snapshot"
        python dev/goldenspike.py --clones 3
