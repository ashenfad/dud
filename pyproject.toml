[project]
name = "dud"
version = "0.4.0"
description = "A dumb firecracker: real, disposable machines for versioned agent workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
keywords = ["agents", "sandbox", "microvm", "firecracker", "vfkit", "workspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

# `dud-emit` is the emit channel as a command, for shell execs. On VM
# rungs the rootfs ships its own shim at the same path; this entry is
# what puts it on PATH for the subprocess rung, where the guest runs as
# host processes and inherits the host's PATH — so one conformance
# corpus covers the command on every rung instead of two.
[project.scripts]
dud-emit = "dud.guest.emit:main"

[project.urls]
"Homepage" = "https://github.com/ashenfad/dud"
"Documentation" = "https://github.com/ashenfad/dud#readme"
"Bug Tracker" = "https://github.com/ashenfad/dud/issues"
"Source" = "https://github.com/ashenfad/dud"

[project.optional-dependencies]
# reprobate exercises the optional smart-render path; it is NOT a
# runtime dependency (dud has none) — callers layer it into the
# image with packages=["reprobate"] when they want it.
dev = ["pytest>=8", "ruff", "reprobate>=0.1.3"]

[build-system]
requires = ["hatchling>=1.26"]  # license = "MIT" is PEP 639 string form
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dud"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the rule set instead of inheriting ruff's defaults. CI installs
# ruff unpinned, so when 0.16 widened those defaults (BLE001, S110,
# I001 and friends) a routine tool release became a lint policy change
# nobody chose — 82 findings against unmodified code, and a red build
# on every branch at once. These four are what was actually being
# enforced before that: real errors and undefined names, not style.
#
# Additions past that baseline are deliberate, one rule at a time:
#   BLE001 — every `except Exception` is either narrowed to the types
#            that path actually expects, or carries a `# noqa: BLE001 —
#            <reason>` saying why breadth is the right call. The rule
#            earns its place by making the next one an argued choice.
select = ["E4", "E7", "E9", "F", "BLE001"]
