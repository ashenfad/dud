[project]
name = "dud"
version = "0.2.1"
description = "A dumb firecracker: real, disposable machines for versioned agent workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
keywords = ["agents", "sandbox", "microvm", "firecracker", "vfkit", "workspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/ashenfad/dud"
"Documentation" = "https://github.com/ashenfad/dud#readme"
"Bug Tracker" = "https://github.com/ashenfad/dud/issues"
"Source" = "https://github.com/ashenfad/dud"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling>=1.26"]  # license = "MIT" is PEP 639 string form
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dud"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the rule set instead of inheriting ruff's defaults. CI installs
# ruff unpinned, so when 0.16 widened those defaults (BLE001, S110,
# I001 and friends) a routine tool release became a lint policy change
# nobody chose — 82 findings against unmodified code, and a red build
# on every branch at once. These four are what was actually being
# enforced before that: real errors and undefined names, not style.
#
# Several of the newly-default rules would be worth adopting (BLE001
# especially, given how many best-effort `except Exception` paths the
# pool and teardown code carries). That's a deliberate commit with the
# fixes beside it, not something a `pip install` should decide.
select = ["E4", "E7", "E9", "F"]
